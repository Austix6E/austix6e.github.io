<html>
    <head>

        <meta charset="UTF-8">
        <title>Austix6E</title>

        <link rel="stylesheet" href="../../css/style.css">
        
    </head>

    <body>

		<div>
			<p style="text-align: center; font-size: 35px; margin-bottom: 5px; margin-top: 25px" class="consolas" >Voltage Divider</p>
        </div>
        
		<div class="centerHorizontal" style="width:200px; background-color: white; padding: 10px; border-radius: 20px">
			<img style="width:100%" src="rdiv.png"/>
		</div>
        
        <div style="text-align: center;">
            <div style="display: inline-block; text-align: left; color: white; font-size: 18px">
                
                <br>
                \(R_1 = \)
                <input id="r1" onClick="this.select();" type="text" style="width: 75px;" name="r1" value="10k">
                <br><br>
                
                \(R_2 = \)
                <input id="r2" onClick="this.select();" type="text" style="width: 75px;" name="r2">
                <br><br>
                
                \({V_o \over V_i} = \)
                <input id="ratio" onClick="this.select();" type="text" style="width: 75px;" name="Ratio" value=".234">
                <br><br>
				
            </div>


        </div>
        
        <div style="display: flex; justify-content: center;">
            <div style="display: inline-block; text-align: center;">
                <button style="margin: 10 auto 10 auto;" class="button_small" onclick="calculateVoltageDivider();">
                    Calculate
                </button>
                <button  class="button_small" style="margin: 10 auto 10 auto;" onclick="document.getElementById(&#34;log&#34;).innerHTML = &#34;&#34;;">
                    <span >CLS</span>
                </button>
            </div>
        </div>
		
        <div id="log-container" style="text-align:left; flex: 1 1 100%; max-width:100%;">
            <pre id="log"></pre>
        </div>
        
        
        
        <script>
        
            document.getElementById("ratio").addEventListener("keyup", function(event) {
                event.preventDefault();
                if (event.keyCode === 13) {
                    calculateVoltageDivider();
                }
            });
            
        </script>
        <script src='script.js'></script>
        <script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/MathJax.js?config=TeX-MML-AM_CHTML' async></script>
        
    </body>

</html>
